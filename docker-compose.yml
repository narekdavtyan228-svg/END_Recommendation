# Development and test stand: PostgreSQL, a stub of the local model, the API and the worker.
# Secrets are files from ./secrets (create them with `make dev-secrets`); nothing is baked in.
x-app: &app
  build: {context: ., target: runtime}
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  restart: unless-stopped
  depends_on:
    migrate: {condition: service_completed_successfully}
    fake-llm: {condition: service_started}
  secrets: [database_url, llm_api_key, callback_hmac_secret, jwt_public_key]
  environment: &env
    DATABASE_URL_FILE: /run/secrets/database_url
    ORG_CODE: OMG
    LLM_BASE_URL: ${LLM_BASE_URL:-http://fake-llm:8080}
    ALLOW_INSECURE_LLM: ${ALLOW_INSECURE_LLM:-true}
    LLM_API_KEY_FILE: /run/secrets/llm_api_key
    LLM_MODEL: ${LLM_MODEL:-fake-model}
    LLM_JSON_MODE: ${LLM_JSON_MODE:-true}
    JWT_ISSUER: ${JWT_ISSUER:-https://idp.dev.local}
    JWT_AUDIENCE: ai-check
    JWT_PUBLIC_KEY_FILE: /run/secrets/jwt_public_key
    ALLOWED_OUTBOUND_HOSTS: ${ALLOWED_OUTBOUND_HOSTS:-fake-llm,hse.dev.local}
    HSE_CATALOG_EXPORT_URL: https://hse.dev.local/internal/catalog/export
    HSE_CALLBACK_URL: ${HSE_CALLBACK_URL:-}
    CALLBACK_HMAC_SECRET_FILE: /run/secrets/callback_hmac_secret
    LOG_LEVEL: ${LOG_LEVEL:-INFO}

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres-dev-password
      POSTGRES_DB: aicheck
    volumes:
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql/data
    ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d aicheck"]
      interval: 3s
      retries: 20

  fake-llm:
    build: {context: ., target: fake-llm}
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      FAKE_LLM_SCENARIO: ${FAKE_LLM_SCENARIO:-ok}

  migrate:
    build: {context: ., target: runtime}
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      postgres: {condition: service_healthy}
    secrets: [database_url, llm_api_key, callback_hmac_secret, jwt_public_key, owner_url]
    environment: *env
    entrypoint: ["/bin/sh", "-c"]
    command:
      - python -m aicheck.cli migrate --owner-url "$$(cat /run/secrets/owner_url)" &&
        python -m aicheck.cli import-rules --activate

  api:
    <<: *app
    ports: ["127.0.0.1:8000:8000"]

  worker:
    <<: *app
    command: ["python", "-m", "aicheck.jobs.worker"]
    healthcheck: {disable: true}

secrets:
  database_url: {file: ./secrets/database_url}
  owner_url: {file: ./secrets/owner_url}
  llm_api_key: {file: ./secrets/llm_api_key}
  callback_hmac_secret: {file: ./secrets/callback_hmac_secret}
  jwt_public_key: {file: ./secrets/jwt_public_key.pem}

volumes:
  pgdata:
